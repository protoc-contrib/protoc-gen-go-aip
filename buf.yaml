version: v2

# Workspace with one published module and three fixture modules.
#
# The public field-options module's root is the repo root, so the file
# ships to BSR as `protoc_contrib/aip/query.proto` — consumers import it
# by that path. The testpb trees are excluded from it and declared as
# modules in their own right, which is what makes `buf generate` work
# with no config editing:
#
#   - each tree is its own import root, so reference.proto can import
#     "simple/simple.proto" the way its own directory sees it;
#   - names are scoped per module, so query/ and fieldmask/ may both
#     declare `package testpb` without colliding.
#
# Regenerate fixtures with a plain `buf generate` from the repo root.
modules:
  - path: .
    name: buf.build/protoc-contrib/protoc-gen-go-aip
    excludes:
      - internal/generator/resource/testpb
      - internal/generator/query/testpb
      - internal/generator/fieldmask/testpb
  - path: internal/generator/resource/testpb
  - path: internal/generator/query/testpb
  - path: internal/generator/fieldmask/testpb

deps:
  - buf.build/googleapis/googleapis

lint:
  use:
    - BASIC
  except:
    # Fixture packages intentionally use the plain "tests.*" style rather
    # than a versioned package suffix.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # reference.proto imports simple/external so the Go generator can see
    # their resource types at codegen time, even though the imports aren't
    # referenced in the proto syntax.
    - IMPORT_USED
breaking:
  use:
    - FILE
