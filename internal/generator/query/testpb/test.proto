// Test fixture for the protoc-gen-go-aip query pass.
//
// The Book resource is derived from ListBooksResponse's repeated field, so
// no annotation ties the request to it. Book exercises every CEL type the
// generator supports (string, int, bool, enum, timestamp) plus a field with
// none — `cover`, a nested message — which must be skipped rather than
// rejected.
//
// Regenerate with `buf generate` from the repo root.
syntax = "proto3";

package tests.query;

import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/protoc-contrib/protoc-gen-go-aip/internal/generator/query/testpb;testpb";

enum Genre {
  GENRE_UNSPECIFIED = 0;
  GENRE_FICTION = 1;
  GENRE_NONFICTION = 2;
}

message Book {
  option (google.api.resource) = {
    type: "testpb/Book"
    pattern: "books/{book}"
    plural: "books"
    singular: "book"
  };

  string name = 1;
  string title = 2;
  string author = 3;
  int64 read_count = 4;
  bool published = 5;
  Genre genre = 6;
  google.protobuf.Timestamp create_time = 7;
  // No CEL type: a nested message the generator must skip.
  Cover cover = 8;
  // No CEL type: repeated fields have no total order.
  repeated string tags = 9;
}

message Cover {
  string url = 1;
}

message ListBooksRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
}

message ListBooksResponse {
  repeated Book books = 1;
  string next_page_token = 2;
}

service Library {
  // The resource for ListBooksRequest is read off this method's response.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
}
