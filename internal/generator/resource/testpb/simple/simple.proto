syntax = "proto3";

package tests.simple;

option go_package = "github.com/protoc-contrib/protoc-gen-go-aip/internal/generator/resource/testpb/simple";

import "google/api/resource.proto";

// Thing exercises a single-segment resource pattern.
message Thing {
  option (google.api.resource) = {
    type: "example.com/Thing"
    pattern: "things/{thing}"
  };

  string name = 1;
}

// Project is the parent of ProjectThing. Declaring it separately lets the
// generator bind ProjectThing.Parent() to ProjectName.
message Project {
  option (google.api.resource) = {
    type: "example.com/Project"
    pattern: "projects/{project}"
  };

  string name = 1;
}

// ProjectThing exercises a multi-segment, single-pattern resource. Its parent
// pattern matches Project above, so Parent() returns ProjectName.
message ProjectThing {
  option (google.api.resource) = {
    type: "example.com/ProjectThing"
    pattern: "projects/{project}/things/{thing}"
  };

  string name = 1;
}

// ReadProjectThingRequest and ListProjectThingsRequest are in buf.gen.yaml's
// wildcard_requests. The own segment of a name, a string here, may not be the
// wildcard; a parent may be, whole.
message ReadProjectThingRequest {
  string name = 1 [(google.api.resource_reference) = {type: "example.com/ProjectThing"}];
}

message ListProjectThingsRequest {
  string parent = 1 [(google.api.resource_reference) = {type: "example.com/Project"}];
}
