syntax = "proto3";

package tests.uuid;

option go_package = "github.com/protoc-contrib/protoc-gen-go-aip/internal/generator/resource/testpb/uuid";

import "google/api/field_info.proto";
import "google/api/resource.proto";

// Collection is a single-pattern resource. Its terminal segment is typed
// uuid.UUID because CreateCollectionRequest.collection_id carries
// field_info.format = UUID4 (AIP-133).
message Collection {
  option (google.api.resource) = {
    type: "example.com/Collection"
    pattern: "collections/{collection}"
  };

  string name = 1;
}

message CreateCollectionRequest {
  Collection collection = 1;
  string collection_id = 2 [(google.api.field_info).format = UUID4];
}

// Organization is the parent resource exercised by Item.Parent(). Its
// terminal segment is typed via CreateOrganizationRequest.organization_id.
message Organization {
  option (google.api.resource) = {
    type: "example.com/Organization"
    pattern: "organizations/{organization}"
  };

  string name = 1;
}

message CreateOrganizationRequest {
  Organization organization = 1;
  string organization_id = 2 [(google.api.field_info).format = UUID4];
}

// Item exercises a parent/child pair where both segments are UUID4. The
// {organization} segment inherits its format from Organization's Create
// request; {item} comes from CreateItemRequest.item_id. Parent() flows the
// typed organization id into OrganizationName without string bridging.
message Item {
  option (google.api.resource) = {
    type: "example.com/Item"
    pattern: "organizations/{organization}/items/{item}"
  };

  string name = 1;
}

message CreateItemRequest {
  string parent = 1;
  Item item = 2;
  string item_id = 3 [(google.api.field_info).format = UUID4];
}

// GetItemRequest and ListItemsRequest carry the name a standard method acts
// on: their ParseName and ParseParent also validate it, so a wildcard is no
// name. ReadItemRequest is one of buf.gen.yaml's wildcard_requests, so its
// ParseName does not. ScopeItemsRequest's `scope` is any other reference,
// which may be one.
message GetItemRequest {
  string name = 1 [(google.api.resource_reference) = {type: "example.com/Item"}];
}

message ListItemsRequest {
  string parent = 1 [(google.api.resource_reference) = {type: "example.com/Organization"}];
}

message ScopeItemsRequest {
  string scope = 1 [(google.api.resource_reference) = {type: "example.com/Organization"}];
}

message ReadItemRequest {
  string name = 1 [(google.api.resource_reference) = {type: "example.com/Item"}];
}
